  :root{
    --teal:#51b19d;
    --red:#df484c;
    --blue:#3a5df6;
    --white:#ffffff;
    --off-white:#eceefc;
    --ink-1:#090b12;
    --ink-2:#111827;
    --ink-3:#171e39;
    --line:#262c3f;
    --text:#eceefc;
    --text-2:#7b8296;
    --sub:#b3bef8;
    --font-headline:'Saira',sans-serif;
    --font-body:'Public Sans',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:
      radial-gradient(ellipse 120% 90% at 50% 36%, var(--ink-3) 0%, var(--ink-2) 45%, var(--ink-1) 100%);
    overflow:hidden;
  }
  body{
    font-family:var(--font-body);
    color:var(--text);
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  #bgCanvas{
    position:absolute;inset:0;z-index:0;pointer-events:none;display:block;
  }

  /* header */
  header{
    position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:28px 32px;
  }
  .logo{display:flex;align-items:center;gap:10px;opacity:0.95;}
  .logo img{height:26px;width:auto;display:block;}
  .socials{display:flex;align-items:center;gap:10px;}
  .social-link{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);color:var(--text-2);
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .social-link:hover{color:var(--text);border-color:rgba(255,255,255,0.35);transform:translateY(-1px);}

  .docs-link{
    display:flex;align-items:center;justify-content:center;
    height:38px;padding:0 18px;border-radius:999px;
    border:1px solid var(--line);color:var(--text-2);
    font-family:var(--font-body);font-size:13px;font-weight:500;
    letter-spacing:0.02em;text-decoration:none;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .docs-link:hover{color:var(--text);border-color:rgba(255,255,255,0.35);transform:translateY(-1px);}

  @media (max-width:600px){
    header{padding:18px 20px;}
    .logo img{height:20px;}
    .socials{gap:8px;}
    .social-link{width:34px;height:34px;}
    .docs-link{height:34px;padding:0 14px;font-size:12px;}
  }

  /* center text */
  .copy{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;
    padding:0 24px;
  }
  .copy h1{
    font-family:var(--font-headline);
    font-weight:800;
    letter-spacing:0.01em;
    line-height:1.14;
    font-size:clamp(28px, 5.4vw, 64px);
    max-width:16ch;
  }
  .copy .sub{
    margin-top:22px;
    font-family:var(--font-body);
    font-weight:400;
    font-size:clamp(12px,1.6vw,15px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--sub);
  }

  /* game elements */
  .playfield{position:absolute;inset:0;z-index:10;}

  .paddle{
    position:absolute;
    height:12px;
    border-radius:999px;
    transform:translate(-50%,-50%);
    will-change:transform, left;
    transition:box-shadow .12s ease, filter .12s ease;
  }
  .paddle.top{
    background:var(--teal);
    box-shadow:0 0 10px rgba(81,177,157,0.55), 0 0 26px rgba(81,177,157,0.18);
  }
  .paddle.bottom{
    background:var(--red);
    box-shadow:0 0 10px rgba(223,72,76,0.55), 0 0 26px rgba(223,72,76,0.18);
  }
  .paddle.hit-top{animation:pulseGreen .4s ease;}
  .paddle.hit-bottom{animation:pulseRed .4s ease;}
  @keyframes pulseGreen{
    0%{box-shadow:0 0 10px rgba(81,177,157,0.55), 0 0 26px rgba(81,177,157,0.18);filter:brightness(1);}
    28%{box-shadow:0 0 50px 14px rgba(81,177,157,0.95), 0 0 100px 30px rgba(81,177,157,0.55);filter:brightness(1.6);}
    100%{box-shadow:0 0 10px rgba(81,177,157,0.55), 0 0 26px rgba(81,177,157,0.18);filter:brightness(1);}
  }
  @keyframes pulseRed{
    0%{box-shadow:0 0 10px rgba(223,72,76,0.55), 0 0 26px rgba(223,72,76,0.18);filter:brightness(1);}
    28%{box-shadow:0 0 50px 14px rgba(223,72,76,0.95), 0 0 100px 30px rgba(223,72,76,0.55);filter:brightness(1.6);}
    100%{box-shadow:0 0 10px rgba(223,72,76,0.55), 0 0 26px rgba(223,72,76,0.18);filter:brightness(1);}
  }

  .ball{
    position:absolute;
    width:16px;height:16px;
    border-radius:50%;
    background:#fdfdfd;
    transform:translate(-50%,-50%);
    will-change:transform, left, top;
  }
  .ball.hidden{opacity:0;}
  .ball.falling{
    transition:opacity .35s ease;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="bgCanvas"></canvas>

<script>
(function(){
  const stage = document.getElementById('stage');
  const paddleTopEl = document.getElementById('paddleTop');
  const paddleBottomEl = document.getElementById('paddleBottom');
  const ballEl = document.getElementById('ball');
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');

  let W = window.innerWidth, H = window.innerHeight;

  const isMobile = () => W < 640;

  const cfg = {
    get paddleW(){ return isMobile() ? 92 : 140; },
    paddleH: 12,
    ballR: 8,
    get edgeGutterX(){ return isMobile() ? 24 : 48; },
    get edgeGutterY(){ return isMobile() ? 86 : 108; },
    controlZone: 130,
    smoothing: 0.20,
    autoSmoothing: 0.11,
    baseSpeed: 4.6,
    maxSpeed: 10,
    speedGrowth: 1.035,
    get dotSpacing(){ return isMobile() ? 22 : 30; },
    dotInfluence: 150,
    trailLength: 8,
    trailGap: 26,
  };

  const DOT_COLORS = {
    white: [255, 255, 255],
    offwhite: [236, 238, 252],
    teal: [81, 177, 157],
    red: [223, 72, 76],
    blue: [58, 93, 246],
  };

  let dots = [];
  function buildDots(){
    dots = [];
    const spacing = cfg.dotSpacing;
    const cols = Math.ceil(W / spacing) + 1;
    const rows = Math.ceil(H / spacing) + 1;
    for(let row = 0; row <= rows; row++){
      for(let col = 0; col <= cols; col++){
        const x = col * spacing;
        const y = row * spacing;
        let colorType = 'offwhite';
        const roll = Math.random();
        if(roll < 0.32) colorType = 'teal';
        else if(roll < 0.50) colorType = 'blue';
        else if(roll < 0.66) colorType = 'red';
        else if(roll < 0.82) colorType = 'white';
        dots.push({
          x, y,
          shape: Math.random() < 0.4 ? 'square' : 'circle',
          baseR: 0.5 + Math.random() * 0.4,
          baseAlpha: 0.10 + Math.random() * 0.14,
          phase: Math.random() * Math.PI * 2,
          speed: 0.5 + Math.random() * 0.7,
          colorType,
          twinkleStart: -1,
          twinkleDuration: 0,
          nextTwinkle: performance.now() + 1500 + Math.random() * 20000
        });
      }
    }
  }

  function resizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    bgCanvas.width = Math.round(W * dpr);
    bgCanvas.height = Math.round(H * dpr);
    bgCanvas.style.width = W + 'px';
    bgCanvas.style.height = H + 'px';
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let trail = [];
  let lastTrailPos = null;

  let shootingStar = null;
  let nextShootingStar = performance.now() + 5000 + Math.random() * 8000;

  function spawnShootingStar(now){
    const angle = (25 + Math.random() * 25) * Math.PI / 180;
    const dirX = Math.random() < 0.5 ? 1 : -1;
    const dirY = Math.random() < 0.5 ? 1 : -1;
    const travel = Math.hypot(W, H) * (0.55 + Math.random() * 0.35);
    const vx = Math.cos(angle) * dirX;
    const vy = Math.sin(angle) * dirY;
    const margin = 60;

    const x0 = dirX > 0 ? -margin + Math.random() * W * 0.25 : W + margin - Math.random() * W * 0.25;
    const y0 = dirY > 0 ? -margin + Math.random() * H * 0.25 : H + margin - Math.random() * H * 0.25;
    const size = (isMobile() ? 14 : 20) + Math.random() * 6;

    shootingStar = {
      startTime: now,
      duration: 1700 + Math.random() * 900,
      x0, y0,
      x1: x0 + vx * travel,
      y1: y0 + vy * travel,
      size,
      blockGap: size * 0.6,
      blockLifespan: 550 + Math.random() * 200,
      blocks: [],
      lastBlockPos: null,
    };
  }

  function drawShootingStar(now){
    if(!shootingStar){
      if(now >= nextShootingStar) spawnShootingStar(now);
      return;
    }
    const s = shootingStar;
    const progress = (now - s.startTime) / s.duration;
    const traveling = progress < 1;
    let headX, headY;

    if(traveling){
      const p = Math.max(0, progress);
      headX = s.x0 + (s.x1 - s.x0) * p;
      headY = s.y0 + (s.y1 - s.y0) * p;

      if(!s.lastBlockPos){
        s.blocks.push({ x: headX, y: headY, spawnTime: now });
        s.lastBlockPos = { x: headX, y: headY };
      } else {
        const dx = headX - s.lastBlockPos.x, dy = headY - s.lastBlockPos.y;
        if(Math.sqrt(dx * dx + dy * dy) >= s.blockGap){
          s.blocks.push({ x: headX, y: headY, spawnTime: now });
          s.lastBlockPos = { x: headX, y: headY };
        }
      }
    }

    s.blocks = s.blocks.filter(b => now - b.spawnTime < s.blockLifespan);

    for(let i = 0; i < s.blocks.length; i++){
      const b = s.blocks[i];
      const t = Math.min(1, (now - b.spawnTime) / s.blockLifespan);
      const alpha = Math.pow(1 - t, 1.3) * 0.85;
      const size = s.size * (1 - t * 0.4);
      const mix = Math.min(1, t * 1.7);
      const r = Math.round(255 + (81 - 255) * mix);
      const g = Math.round(255 + (177 - 255) * mix);
      const bch = Math.round(255 + (157 - 255) * mix);
      bgCtx.shadowColor = 'rgba(81,177,157,0.5)';
      bgCtx.shadowBlur = 5;
      bgCtx.fillStyle = `rgba(${r},${g},${bch},${alpha})`;
      bgCtx.fillRect(b.x - size / 2, b.y - size / 2, size, size);
      bgCtx.shadowBlur = 0;
    }

    if(traveling){
      const headFade = progress < 0.08 ? progress / 0.08 : (progress > 0.92 ? (1 - progress) / 0.08 : 1);
      bgCtx.shadowColor = 'rgba(255,255,255,0.95)';
      bgCtx.shadowBlur = 22;
      bgCtx.fillStyle = `rgba(255,255,255,${Math.max(0, headFade)})`;
      bgCtx.fillRect(headX - s.size / 2, headY - s.size / 2, s.size, s.size);
      bgCtx.shadowBlur = 0;
    } else if(s.blocks.length === 0){
      shootingStar = null;
      nextShootingStar = now + 12000 + Math.random() * 25000;
    }
  }

  function pushTrailPoint(x, y){
    if(lastTrailPos){
      const dx = x - lastTrailPos.x, dy = y - lastTrailPos.y;
      if(Math.sqrt(dx * dx + dy * dy) < cfg.trailGap) return;
    }
    trail.push({ x, y });
    lastTrailPos = { x, y };
    if(trail.length > cfg.trailLength) trail.shift();
  }

  function drawBackground(now){
    const t = now / 1000;
    bgCtx.clearRect(0, 0, W, H);

    const ballActive = ball.mode === 'live' || ball.mode === 'falling';
    const influence = cfg.dotInfluence;

    for(let i = 0; i < dots.length; i++){
      const d = dots[i];
      const flicker = Math.sin(t * d.speed + d.phase) * 0.5 + 0.5;
      let alpha = d.baseAlpha + flicker * 0.05;
      let glow = 0;

      if(d.twinkleStart >= 0){
        const elapsed = now - d.twinkleStart;
        if(elapsed < d.twinkleDuration){
          const twinkle = Math.sin((elapsed / d.twinkleDuration) * Math.PI);
          alpha = Math.min(1, alpha + twinkle * 0.8);
          glow = Math.max(glow, twinkle);
        } else {
          d.twinkleStart = -1;
          d.nextTwinkle = now + 15000 + Math.random() * 130000;
        }
      } else if(now >= d.nextTwinkle){
        d.twinkleStart = now;
        d.twinkleDuration = 500 + Math.random() * 600;
      }

      if(ballActive){
        const dx = d.x - ball.x, dy = d.y - ball.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < influence){
          const boost = 1 - dist / influence;
          alpha = Math.min(1, alpha + boost * 0.9);
          glow = Math.max(glow, boost > 0.35 ? boost : 0);
        }
      }

      if(glow > 0){
        bgCtx.shadowColor = 'rgba(255,255,255,0.85)';
        bgCtx.shadowBlur = 6 * glow;
      }

      const c = DOT_COLORS[d.colorType];
      bgCtx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
      if(d.shape === 'square'){
        const s = d.baseR * 2;
        bgCtx.fillRect(d.x - d.baseR, d.y - d.baseR, s, s);
      } else {
        bgCtx.beginPath();
        bgCtx.arc(d.x, d.y, d.baseR, 0, Math.PI * 2);
        bgCtx.fill();
      }
      bgCtx.shadowBlur = 0;
    }

    drawShootingStar(now);

    const len = trail.length;
    for(let i = 0; i < len; i++){
      const p = trail[i];
      const progress = (i + 1) / len;
      const eased = Math.pow(progress, 1.6);
      const radius = ball.r * (0.08 + 0.32 * eased);
      const alpha = 0.45 * eased;
      bgCtx.beginPath();
      bgCtx.fillStyle = `rgba(200,215,255,${alpha})`;
      bgCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      bgCtx.fill();
    }
  }

  let bounds = { left:0, right:W, top:0, bottom:H };
  function computeBounds(){
    W = window.innerWidth; H = window.innerHeight;
    bounds = {
      left: cfg.edgeGutterX,
      right: W - cfg.edgeGutterX,
      top: cfg.edgeGutterY,
      bottom: H - cfg.edgeGutterY
    };
  }
  computeBounds();

  const paddleTop = { x: W/2, y: bounds.top, w: cfg.paddleW };
  const paddleBottom = { x: W/2, y: bounds.bottom, w: cfg.paddleW };

  let mouse = { x: W/2, y: H/2, has:false };

  function pointerMove(x, y){
    mouse.x = x; mouse.y = y; mouse.has = true;
  }
  function pointerGone(){ mouse.has = false; }

  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if(e.touches && e.touches[0]) pointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  // Robustly detect the pointer leaving the viewport — 'mouseleave' on window
  // alone is unreliable, so back it up with a relatedTarget-null 'mouseout'
  // check (the standard trick for "cursor left the document"), plus a
  // window-blur fallback for alt-tab / switching apps.
  document.addEventListener('mouseleave', pointerGone);
  document.addEventListener('mouseout', e => {
    if(!e.relatedTarget && !e.toElement) pointerGone();
  });
  window.addEventListener('blur', pointerGone);
  window.addEventListener('touchend', pointerGone);
  window.addEventListener('touchcancel', pointerGone);

  function ballState(){
    return {
      x: W/2, y: H/2,
      vx: 0, vy: 0,
      r: cfg.ballR,
      mode: 'idle' // idle -> falling -> live
    };
  }
  let ball = ballState();

  function launchBall(){
    ball.x = W/2;
    ball.y = H/2 - 40;
    ball.vx = 0; ball.vy = 0;
    ball.mode = 'falling';
    ballEl.classList.remove('hidden');
    ballEl.style.opacity = '1';

    const targetY = H/2;
    const startY = ball.y;
    const duration = 420;
    const startT = performance.now();

    function fall(now){
      const t = Math.min(1, (now - startT) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      ball.y = startY + (targetY - startY) * eased;
      pushTrailPoint(ball.x, ball.y);
      if(t < 1){
        requestAnimationFrame(fall);
      } else {
        ball.mode = 'live';
        const dir = Math.random() < 0.5 ? -1 : 1;
        const angle = (Math.random() * 0.5 - 0.25);
        ball.vx = cfg.baseSpeed * Math.sin(angle * Math.PI);
        ball.vy = dir * cfg.baseSpeed;
      }
    }
    requestAnimationFrame(fall);
  }

  function missBall(){
    ball.mode = 'idle';
    ballEl.style.opacity = '0';
    trail = [];
    lastTrailPos = null;
    setTimeout(launchBall, 480);
  }

  function pulsePaddle(which){
    const el = which === 'top' ? paddleTopEl : paddleBottomEl;
    const cls = which === 'top' ? 'hit-top' : 'hit-bottom';
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function updatePaddles(){
    const dTop = mouse.has ? Math.abs(mouse.y - paddleTop.y) : Infinity;
    const dBottom = mouse.has ? Math.abs(mouse.y - paddleBottom.y) : Infinity;

    if(dTop <= cfg.controlZone){
      const targetX = clamp(mouse.x, bounds.left, bounds.right);
      paddleTop.x += (targetX - paddleTop.x) * cfg.smoothing;
    } else {
      autoDrive(paddleTop);
    }

    if(dBottom <= cfg.controlZone){
      const targetX = clamp(mouse.x, bounds.left, bounds.right);
      paddleBottom.x += (targetX - paddleBottom.x) * cfg.smoothing;
    } else {
      autoDrive(paddleBottom);
    }
  }

  function autoDrive(paddle){
    const targetX = (ball.mode === 'live' || ball.mode === 'falling')
      ? clamp(ball.x, bounds.left, bounds.right)
      : W / 2;
    paddle.x += (targetX - paddle.x) * cfg.autoSmoothing;
  }

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function updateBall(){
    if(ball.mode !== 'live') return;

    pushTrailPoint(ball.x, ball.y);

    ball.x += ball.vx;
    ball.y += ball.vy;

    // side walls
    if(ball.x - ball.r < bounds.left){
      ball.x = bounds.left + ball.r;
      ball.vx *= -1;
    } else if(ball.x + ball.r > bounds.right){
      ball.x = bounds.right - ball.r;
      ball.vx *= -1;
    }

    // top paddle collision
    if(ball.vy < 0 &&
       ball.y - ball.r <= paddleTop.y + cfg.paddleH/2 &&
       ball.y - ball.r >= paddleTop.y - cfg.paddleH/2 - 10 &&
       Math.abs(ball.x - paddleTop.x) <= paddleTop.w/2 + ball.r){
      ball.y = paddleTop.y + cfg.paddleH/2 + ball.r;
      const offset = clamp((ball.x - paddleTop.x) / (paddleTop.w/2), -1, 1);
      const speed = clamp(Math.hypot(ball.vx, ball.vy) * cfg.speedGrowth, cfg.baseSpeed, cfg.maxSpeed);
      const angle = offset * 0.9;
      ball.vx = speed * Math.sin(angle);
      ball.vy = Math.abs(speed * Math.cos(angle));
      pulsePaddle('top');
    }

    // bottom paddle collision
    if(ball.vy > 0 &&
       ball.y + ball.r >= paddleBottom.y - cfg.paddleH/2 &&
       ball.y + ball.r <= paddleBottom.y + cfg.paddleH/2 + 10 &&
       Math.abs(ball.x - paddleBottom.x) <= paddleBottom.w/2 + ball.r){
      ball.y = paddleBottom.y - cfg.paddleH/2 - ball.r;
      const offset = clamp((ball.x - paddleBottom.x) / (paddleBottom.w/2), -1, 1);
      const speed = clamp(Math.hypot(ball.vx, ball.vy) * cfg.speedGrowth, cfg.baseSpeed, cfg.maxSpeed);
      const angle = offset * 0.9;
      ball.vx = speed * Math.sin(angle);
      ball.vy = -Math.abs(speed * Math.cos(angle));
      pulsePaddle('bottom');
    }

    // missed — past top or bottom
    if(ball.y < -40 || ball.y > H + 40){
      missBall();
    }
  }

  function render(){
    paddleTopEl.style.left = paddleTop.x + 'px';
    paddleTopEl.style.top = paddleTop.y + 'px';
    paddleTopEl.style.width = paddleTop.w + 'px';

    paddleBottomEl.style.left = paddleBottom.x + 'px';
    paddleBottomEl.style.top = paddleBottom.y + 'px';
    paddleBottomEl.style.width = paddleBottom.w + 'px';

    if(ball.mode !== 'idle'){
      ballEl.style.left = ball.x + 'px';
      ballEl.style.top = ball.y + 'px';
    }
  }

  function loop(now){
    updatePaddles();
    updateBall();
    drawBackground(now || performance.now());
    render();
    requestAnimationFrame(loop);
  }

  function onResize(){
    computeBounds();
    paddleTop.y = bounds.top;
    paddleBottom.y = bounds.bottom;
    paddleTop.w = cfg.paddleW;
    paddleBottom.w = cfg.paddleW;
    paddleTop.x = clamp(paddleTop.x, bounds.left, bounds.right);
    paddleBottom.x = clamp(paddleBottom.x, bounds.left, bounds.right);
    resizeCanvas();
    buildDots();
  }
  window.addEventListener('resize', onResize);

  ballEl.style.opacity = '0';
  onResize();
  render();
  loop();
  setTimeout(launchBall, 500);
})();
</script>

</body>
</html>
